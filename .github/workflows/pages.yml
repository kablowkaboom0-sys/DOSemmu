name: Build DOSBox WASM and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOSemmu
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build local DOSBox WASM
        run: |
          git clone --depth 1 --branch em-dosbox-svn-sdl2 https://github.com/dreamlayers/em-dosbox.git em-dosbox-wasm
          cd em-dosbox-wasm
          ./autogen.sh
          emconfigure ./configure --enable-wasm --disable-opengl --host=none-none-none CFLAGS="-O2" LDFLAGS="-sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=67108864 -sMAXIMUM_MEMORY=268435456 -sFORCE_FILESYSTEM=1 -sASSERTIONS=1"
          sed -i 's/ --memory-init-file 0//g' src/Makefile
          emmake make

      - name: Build local DOSBox asm.js fallback
        run: |
          git clone --depth 1 --branch em-dosbox-svn-sdl2 https://github.com/dreamlayers/em-dosbox.git em-dosbox-asm
          cd em-dosbox-asm
          ./autogen.sh
          emconfigure ./configure --disable-wasm --disable-opengl --host=none-none-none CFLAGS="-O2" LDFLAGS="-sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=67108864 -sMAXIMUM_MEMORY=268435456 -sFORCE_FILESYSTEM=1 -sASSERTIONS=1"
          sed -i 's/ --memory-init-file 0//g' src/Makefile
          emmake make

      - name: Patch Emscripten numeric event targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = "specialHTMLTargets[target] || (typeof document !== 'undefined' ? document.querySelector(target) : void 0)"
          replacement = "specialHTMLTargets[target] || (typeof target === 'number' ? void 0 : (typeof document !== 'undefined' ? document.querySelector(target) : void 0))"

          for path in [
              Path("em-dosbox-wasm/src/dosbox.js"),
              Path("em-dosbox-asm/src/dosbox.js"),
          ]:
              text = path.read_text()
              if needle not in text:
                  raise SystemExit(f"Expected Emscripten event-target code not found in {path}")
              text = text.replace(needle, replacement)
              path.write_text(text)
              print(f"Patched {path}")

      - name: Assemble site
        run: |
          mkdir -p _site/dosbox
          test -s fflate.js
          test -s em-dosbox-wasm/src/dosbox.js
          test -s em-dosbox-wasm/src/dosbox.wasm
          test -s em-dosbox-asm/src/dosbox.js
          cp index.html _site/index.html
          cp fflate.js _site/fflate.js
          cp em-dosbox-wasm/src/dosbox.js _site/dosbox.js
          cp em-dosbox-wasm/src/dosbox.wasm _site/dosbox.wasm
          cp em-dosbox-asm/src/dosbox.js _site/dosbox-asm.js
          cp em-dosbox-wasm/src/dosbox.js _site/dosbox/dosbox.js
          cp em-dosbox-wasm/src/dosbox.wasm _site/dosbox/dosbox.wasm
          cp em-dosbox-asm/src/dosbox.js _site/dosbox/dosbox-asm.js
          cp em-dosbox-wasm/src/dosbox.html _site/dosbox/dosbox.html
          cp em-dosbox-wasm/COPYING _site/dosbox/COPYING
          printf '%s\n' 'DOSBox is GPL software. Source: https://github.com/dreamlayers/em-dosbox' > _site/dosbox/LICENSE-INFO.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
