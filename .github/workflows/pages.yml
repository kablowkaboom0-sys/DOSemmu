name: Build DOSBox WASM and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DOSemmu
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build Em-DOSBox
        run: |
          git clone --depth 1 --branch em-dosbox-svn-sdl2 https://github.com/dreamlayers/em-dosbox.git em-dosbox
          cd em-dosbox
          ./autogen.sh
          # The old Em-DOSBox Makefile passes --memory-init-file, which modern
          # Emscripten removed. The build does not need that obsolete flag.
          sed -i 's/ --memory-init-file 0//g' src/Makefile
          emconfigure ./configure --enable-wasm --disable-opengl --host=none-none-none CFLAGS="-O2" LDFLAGS="-sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=67108864 -sMAXIMUM_MEMORY=268435456 -sFORCE_FILESYSTEM=1 -sASSERTIONS=1"
          emmake make

      - name: Assemble site
        run: |
          mkdir -p _site/dosbox
          test -s fflate.js
          cp index.html _site/index.html
          cp fflate.js _site/fflate.js
          cp em-dosbox/src/dosbox.js _site/dosbox.js
          cp em-dosbox/src/dosbox.wasm _site/dosbox.wasm
          cp em-dosbox/src/dosbox.js _site/dosbox/dosbox.js
          cp em-dosbox/src/dosbox.wasm _site/dosbox/dosbox.wasm
          cp em-dosbox/src/dosbox.html _site/dosbox/dosbox.html
          cp em-dosbox/COPYING _site/dosbox/COPYING
          printf '%s\n' 'DOSBox is GPL software. Source: https://github.com/dreamlayers/em-dosbox' > _site/dosbox/LICENSE-INFO.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
