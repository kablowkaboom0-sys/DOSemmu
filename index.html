<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOSemmu</title>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:min(100%,1000px);box-sizing:border-box;padding:14px}
h1{font-size:20px;margin:0 0 8px}
p{margin:6px 0;color:#bbb;font-size:14px}
#controls{width:min(100%,1000px);box-sizing:border-box;padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}
button,label{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:7px;padding:9px 12px;cursor:pointer}
input{display:none}
#screen{width:min(100%,960px);aspect-ratio:4/3;background:#000;border:1px solid #444;display:flex;align-items:center;justify-content:center;color:#777}
#status{width:min(100%,960px);box-sizing:border-box;padding:8px 14px;color:#aaa;font-size:13px}
footer{margin-top:auto;padding:12px;color:#777;font-size:12px}
</style>
</head>
<body>
<header><h1>DOSemmu — DOSBox</h1><p>Local DOS program loader. Emulator files are stored in this repository; your selected file is processed in your browser.</p></header>
<div id="controls">
<label for="file">Choose DOS file</label><input id="file" type="file" accept=".exe,.com,.bat,.img,.iso,.zip">
<button id="fullscreen">Fullscreen</button>
<button id="reset">Reset</button>
</div>
<div id="screen"><span>Loading local DOSBox engine…</span></div>
<div id="status">No DOS program selected.</div>
<footer>DOSemmu v0.1</footer>
<script>
const status=document.getElementById('status');
const screen=document.getElementById('screen');
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 status.textContent='Selected: '+f.name+' ('+f.size.toLocaleString()+' bytes)';
});
document.getElementById('fullscreen').onclick=()=>screen.requestFullscreen?.();
document.getElementById('reset').onclick=()=>location.reload();
</script>
</body>
</html>
