<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOSemmu</title>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:min(100%,1000px);box-sizing:border-box;padding:14px}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:#bbb;font-size:14px}
#controls,#programs,#touch{width:min(100%,1000px);box-sizing:border-box;padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}
button,label,select{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:7px;padding:9px 12px;cursor:pointer}input{display:none}
#screen{width:min(100%,960px);aspect-ratio:4/3;background:#000;border:1px solid #444;overflow:hidden}#canvas{width:100%;height:100%;display:block}
#status{width:min(100%,960px);box-sizing:border-box;padding:8px 14px;color:#aaa;font-size:13px}footer{margin-top:auto;padding:12px;color:#777;font-size:12px}.touchbtn{min-width:52px;touch-action:none}
#programs{display:none;align-items:center}#programs select{min-width:220px}#mobileKeyboard{display:none;width:min(100%,1000px);box-sizing:border-box;padding:0 14px 14px;gap:8px}#keyboardHint{color:#888;font-size:12px;padding:9px 4px;align-self:center}#mobileKeyboard input{display:block;flex:1;min-width:0;background:#222;color:#fff;border:1px solid #555;border-radius:7px;padding:10px;font-size:16px}
</style></head><body>
<header><h1>DOSemmu — DOSBox</h1><p>Local DOSBox is bundled in this website. iPad uses a local asm.js fallback if WASM is unavailable.</p></header>
<div id="controls"><label for="file">Choose DOS file or ZIP</label><input id="file" type="file" accept=".exe,.com,.bat,.img,.iso,.zip"><button id="fullscreen">Fullscreen</button><button id="reset">Reset</button><button id="keyboard">⌨ Keyboard</button><span id="keyboardHint">External USB/Bluetooth keyboard supported</span></div>
<div id="programs"><select id="program"></select><button id="launch">Launch selected program</button></div>
<div id="screen"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="mobileKeyboard"><input id="mobileInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type DOS command"><button id="mobileEnter">Enter</button></div>
<div id="status">Choose a .EXE, .COM, .BAT, .IMG, .ISO or .ZIP file to start.</div>
<div id="touch"><button class="touchbtn" data-key="ArrowUp">▲</button><button class="touchbtn" data-key="ArrowDown">▼</button><button class="touchbtn" data-key="ArrowLeft">◀</button><button class="touchbtn" data-key="ArrowRight">▶</button><button class="touchbtn" data-key="Enter">Enter</button><button class="touchbtn" data-key="Escape">Esc</button><button class="touchbtn" data-key="Control">Ctrl</button><button class="touchbtn" data-key=" ">Space</button></div>
<footer>DOSemmu v2.4 — WASM-first mobile runtime</footer>
<script src="fflate.js?v=1.0"></script>
<script>
const input=document.getElementById('file'),status=document.getElementById('status'),canvas=document.getElementById('canvas');
const programs=document.getElementById('programs'),program=document.getElementById('program'),launch=document.getElementById('launch');
const keyboardBtn=document.getElementById('keyboard'),mobileKeyboard=document.getElementById('mobileKeyboard'),mobileInput=document.getElementById('mobileInput'),mobileEnter=document.getElementById('mobileEnter');
const zipLib=window.fflate||null;
if(!zipLib) status.textContent='ZIP extractor failed to load from the repository.';
let started=false,gameFiles=new Map(),selectedProgram='';
window.addEventListener('error',e=>{status.textContent='Runtime error: '+(e.message||'unknown JavaScript error')});
window.addEventListener('unhandledrejection',e=>{status.textContent='Runtime error: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason))});

function cleanPath(path){
  return path.replace(/\\/g,'/').replace(/^\/+/, '').split('/').filter(p=>p && p!=='.' && p!=='..').join('/');
}
function addFile(path,data){
  const p=cleanPath(path);
  if(p && !p.endsWith('/')) gameFiles.set(p,data);
}
function executableCandidates(){
  const files=[...gameFiles.keys()].filter(p=>/\.(exe|com|bat)$/i.test(p));
  const score=p=>{
    const base=p.split('/').pop().toLowerCase();
    const stem=base.replace(/\.(exe|com|bat)$/i,'');
    if(base==='doom2.exe') return 0;
    if(stem==='doom2') return 1;
    if(base==='doom.exe') return 2;
    if(stem==='doom') return 3;
    return 10;
  };
  return files.sort((a,b)=>score(a)-score(b)||a.localeCompare(b));
}
function mkdirp(fs,path){
  let cur='';
  for(const part of path.split('/')){
    if(!part) continue;
    cur+='/'+part;
    try{fs.mkdir(cur)}catch(e){}
  }
}
function mountFiles(fs){
  try{fs.mkdir('/dosgame')}catch(e){}
  for(const [path,data] of gameFiles){
    const parts=path.split('/');
    const dir=parts.slice(0,-1).join('/');
    if(dir) mkdirp(fs,'/dosgame/'+dir);
    fs.writeFile('/dosgame/'+path,data);
  }
}
async function prepare(file){
  gameFiles.clear();
  if(/\.zip$/i.test(file.name)){
    status.textContent='Extracting ZIP locally… '+file.name;
    const zip=new Uint8Array(await file.arrayBuffer());
    if(!zipLib) throw new Error('Bundled ZIP extractor is not available.');
    const entries=zipLib.unzipSync(zip);
    for(const [path,data] of Object.entries(entries)) if(!path.endsWith('/')) addFile(path,data);
    status.textContent='ZIP extracted locally — '+gameFiles.size+' files found.';
  }else{
    addFile(file.name,new Uint8Array(await file.arrayBuffer()));
  }
  const exes=executableCandidates();
  if(!exes.length) throw new Error('No .EXE, .COM or .BAT program was found.');
  program.innerHTML='';
  for(const p of exes){const o=document.createElement('option');o.value=p;o.textContent=p;program.appendChild(o);}
  selectedProgram=exes[0];
  if(exes.length>1){programs.style.display='flex';status.textContent='ZIP extracted — choose the DOS program to launch.';return false;}
  return true;
}
const keyInfo={
  ArrowUp:{code:'ArrowUp',keyCode:38},ArrowDown:{code:'ArrowDown',keyCode:40},
  ArrowLeft:{code:'ArrowLeft',keyCode:37},ArrowRight:{code:'ArrowRight',keyCode:39},
  Enter:{code:'Enter',keyCode:13},Escape:{code:'Escape',keyCode:27},Control:{code:'Control',keyCode:17},
  ' ':{code:'Space',keyCode:32},Space:{code:'Space',keyCode:32}
};
function sendKey(key){
  const info=keyInfo[key]||{code:key.length===1?'Key'+key.toUpperCase():key,keyCode:key.length===1?key.toUpperCase().charCodeAt(0):0};
  canvas.focus();
  const ev=new KeyboardEvent('keydown',{key:key==='Space'?' ':key,code:info.code,bubbles:true,cancelable:true});
  for(const prop of ['keyCode','which','charCode']){try{Object.defineProperty(ev,prop,{value:info.keyCode})}catch(e){}}
  canvas.dispatchEvent(ev);
}
function releaseKey(key){
  const info=keyInfo[key]||{code:key.length===1?'Key'+key.toUpperCase():key,keyCode:key.length===1?key.toUpperCase().charCodeAt(0):0};
  const ev=new KeyboardEvent('keyup',{key:key==='Space'?' ':key,code:info.code,bubbles:true,cancelable:true});
  for(const prop of ['keyCode','which','charCode']){try{Object.defineProperty(ev,prop,{value:info.keyCode})}catch(e){}}
  canvas.dispatchEvent(ev);
}
async function startDosBox(){
  if(started)return;
  started=true;
  const path=selectedProgram;
  const dosParts=path.split('/');
  const dosDir=dosParts.slice(0,-1).join('\\');
  const dosExe=dosParts[dosParts.length-1];
  const dosDirCommand=dosDir ? 'cd '+dosDir : '';
  const args=dosDir
    ? ['-c','mount c: /dosgame','-c','c:','-c',dosDirCommand,'-c',dosExe]
    : ['-c','mount c: /dosgame','-c','c:','-c',dosExe];

  const isIPad=(/iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1));
  const wasmSupported=typeof WebAssembly==='object' && typeof WebAssembly.instantiate==='function';
  const useAsmFallback=isIPad;
  const runtimeFile=useAsmFallback?'dosbox-asm.js':'dosbox.js';
  const runtimeUrl=new URL(runtimeFile,document.baseURI).href;

  window.Module={
    canvas,
    arguments:args,
    locateFile:function(file){return new URL(file,document.baseURI).href},
    noInitialRun:false,
    noExitRuntime:false,
    setStatus:function(t){if(t)status.textContent='DOSBox: '+t},
    onRuntimeInitialized:function(){
      try{
        mountFiles(FS);
        status.textContent=(useAsmFallback?'Local asm.js DOSBox ready — ':'DOSBox WASM ready — ')+'starting '+path;
        canvas.focus();
      }catch(err){
        started=false;
        status.textContent='File setup error: '+(err&&err.message?err.message:err);
        throw err;
      }
    },
    postRun:[function(){status.textContent='DOSBox finished.'}],
    onAbort:function(reason){started=false;status.textContent='DOSBox stopped: '+reason},
    onExit:function(code){started=false;status.textContent='DOSBox exited (code '+code+').'},
    monitorRunDependencies:function(left){
      if(left>0)status.textContent='Loading local '+(useAsmFallback?'asm.js':'WASM')+' DOSBox… '+left+' step(s) left';
    },
    print:function(t){if(t)status.textContent=t},
    printErr:function(t){if(t){status.textContent='DOSBox: '+t;console.error(t)}}
  };

  status.textContent=useAsmFallback
    ? 'iPad compatibility mode — checking bundled asm.js DOSBox…'
    : 'Checking bundled DOSBox WASM…';

  if(useAsmFallback){
    try{
      const probe=await fetch(runtimeUrl,{cache:'no-store',redirect:'follow'});
      const type=(probe.headers.get('content-type')||'').toLowerCase();
      if(!probe.ok) throw new Error('asm.js HTTP '+probe.status);
      if(type.includes('text/html')) throw new Error('asm.js URL returned HTML instead of JavaScript');
      if(!type.includes('javascript') && !type.includes('ecmascript') && !type.includes('text/plain') && !type.includes('application/octet-stream')){
        throw new Error('asm.js unexpected content type: '+type);
      }
      status.textContent='Bundled asm.js file found — loading engine…';
    }catch(err){
      started=false;
      status.textContent='asm.js file check failed: '+err.message+' | '+runtimeUrl;
      return;
    }
  }

  if(!useAsmFallback){
    const wasmUrl=new URL('dosbox.wasm',document.baseURI).href;
    try{
      const probe=await fetch(wasmUrl,{cache:'no-store'});
      if(!probe.ok)throw new Error('WASM HTTP '+probe.status);
      const type=(probe.headers.get('content-type')||'').toLowerCase();
      if(!type.includes('wasm') && !type.includes('octet-stream'))throw new Error('WASM has unexpected content type: '+type);
    }catch(err){
      status.textContent='WASM unavailable ('+err.message+') — switching to bundled asm.js…';
      await new Promise(r=>setTimeout(r,250));
      window.Module=null;
      started=false;
      return startDosBoxAsm(path,args);
    }
  }

  status.textContent='Loading bundled DOSBox '+(useAsmFallback?'asm.js':'WASM')+' engine…';
  const s=document.createElement('script');
  s.src=runtimeUrl+'?v=2.4';
  s.onload=()=>status.textContent='Bundled DOSBox engine loaded — initializing…';
  s.onerror=()=>{
    started=false;
    status.textContent='DOSBox engine script failed: '+s.src;
  };
  document.body.appendChild(s);
}
async function startDosBoxAsm(path,args){
  if(started)return;
  started=true;
  const canvasRef=canvas;
  window.Module={
    canvas:canvasRef,
    arguments:args,
    locateFile:function(file){return new URL(file,document.baseURI).href},
    noInitialRun:false,
    noExitRuntime:false,
    setStatus:function(t){if(t)status.textContent='DOSBox: '+t},
    onRuntimeInitialized:function(){
      try{
        mountFiles(FS);
        status.textContent='Bundled asm.js DOSBox ready — starting '+path;
        canvasRef.focus();
      }catch(err){
        started=false;
        status.textContent='File setup error: '+(err&&err.message?err.message:err);
        throw err;
      }
    },
    postRun:[function(){status.textContent='DOSBox finished.'}],
    onAbort:function(reason){started=false;status.textContent='DOSBox stopped: '+reason},
    onExit:function(code){started=false;status.textContent='DOSBox exited (code '+code+').'},
    monitorRunDependencies:function(left){
      if(left>0)status.textContent='Loading bundled asm.js DOSBox… '+left+' step(s) left';
    },
    print:function(t){if(t)status.textContent=t},
    printErr:function(t){if(t){status.textContent='DOSBox: '+t;console.error(t)}}
  };
  const s=document.createElement('script');
  s.src=new URL('dosbox-asm.js',document.baseURI).href+'?v=2.4';
  s.onload=()=>status.textContent='Bundled asm.js engine loaded — initializing…';
s.onerror=()=>{started=false;status.textContent='asm.js script failed to execute/load: '+s.src};
  document.body.appendChild(s);
}

input.addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file||started)return;
  try{const ready=await prepare(file);if(ready) await startDosBox();}
  catch(err){started=false;status.textContent='File error: '+err.message}
});
program.addEventListener('change',()=>selectedProgram=program.value);
launch.addEventListener('click',async()=>{if(!started){selectedProgram=program.value;programs.style.display='none';await startDosBox()}});
document.getElementById('fullscreen').onclick=()=>document.getElementById('screen').requestFullscreen?.();
document.getElementById('reset').onclick=()=>location.reload();

document.addEventListener('keydown',e=>{
  if(!started || document.activeElement===mobileInput) return;
  canvas.focus();
  const gameKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Control',' ','Tab','Backspace'];
  if(gameKeys.includes(e.key)) e.preventDefault();
});

canvas.addEventListener('pointerdown',()=>{
  if(started) canvas.focus();
});

keyboardBtn.onclick=()=>{mobileKeyboard.style.display=mobileKeyboard.style.display==='flex'?'none':'flex';if(mobileKeyboard.style.display==='flex')setTimeout(()=>mobileInput.focus(),50);};
mobileEnter.onclick=()=>{
  mobileInput.focus();
  const ev=new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true,cancelable:true});
  try{Object.defineProperty(ev,'keyCode',{value:13});Object.defineProperty(ev,'which',{value:13})}catch(e){}
  mobileInput.dispatchEvent(ev);
  mobileInput.value='';
};
mobileInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    setTimeout(()=>{mobileInput.value='';},0);
  }
});
for(const b of document.querySelectorAll('[data-key]')){
  const key=b.dataset.key;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId)}catch(err){}
    b.dataset.held='1';
    sendKey(key);
  });
  b.addEventListener('pointerup',e=>{
    e.preventDefault();
    b.dataset.held='';
    releaseKey(key);
    try{b.releasePointerCapture(e.pointerId)}catch(err){}
  });
  b.addEventListener('pointercancel',e=>{b.dataset.held='';releaseKey(key);});
  b.addEventListener('lostpointercapture',()=>{if(b.dataset.held){b.dataset.held='';releaseKey(key);}});
}</script></body></html>
